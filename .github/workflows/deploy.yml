name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '20'

    - name: Inject environment variables
      run: |
        echo "REACT_APP_API_URL=https://hodutddca9.execute-api.us-east-1.amazonaws.com" >> $GITHUB_ENV
        echo "REACT_APP_WEBSOCKET_URL=wss://7t451nzebb.execute-api.us-east-1.amazonaws.com/prod" >> $GITHUB_ENV

    - name: Verify environment variables
      run: |
        echo "REACT_APP_API_URL=$REACT_APP_API_URL"
        echo "REACT_APP_WEBSOCKET_URL=$REACT_APP_WEBSOCKET_URL"

    - name: Install dependencies
      run: cd frontend && npm install

    - name: Build the React app
      run: cd frontend && npm run build

    - name: Run build script
      run: node build.js

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Sync build/ to S3
      run: aws s3 sync frontend/build/ s3://chazwinter.com/SuperTicTacToe/frontend --delete

    - name: Invalidate CloudFront cache for index.html
      run: |
        aws cloudfront create-invalidation --distribution-id E15GZRLX9201VO --paths /index.html
